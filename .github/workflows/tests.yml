name: Run tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Laravel ${{ matrix.laravel }} / Livewire ${{ matrix.livewire }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: '10', testbench: '^8.0', php: '8.2', livewire: 'none' }
          - { laravel: '10', testbench: '^8.0', php: '8.2', livewire: '3' }
          - { laravel: '10', testbench: '^8.0', php: '8.2', livewire: '4' }
          - { laravel: '11', testbench: '^9.0', php: '8.3', livewire: 'none' }
          - { laravel: '11', testbench: '^9.0', php: '8.3', livewire: '3' }
          - { laravel: '11', testbench: '^9.0', php: '8.3', livewire: '4' }
          - { laravel: '12', testbench: '^10.0', php: '8.4', livewire: 'none' }
          - { laravel: '12', testbench: '^10.0', php: '8.4', livewire: '3' }
          - { laravel: '12', testbench: '^10.0', php: '8.4', livewire: '4' }
          - { laravel: '13', testbench: '^11.0', php: '8.4', livewire: 'none' }
          - { laravel: '13', testbench: '^11.0', php: '8.4', livewire: '3' }
          - { laravel: '13', testbench: '^11.0', php: '8.4', livewire: '4' }
          - { laravel: '13', testbench: '^11.0', php: '8.5', livewire: 'none' }
          - { laravel: '13', testbench: '^11.0', php: '8.5', livewire: '3' }
          - { laravel: '13', testbench: '^11.0', php: '8.5', livewire: '4' }

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, pdo_sqlite, sqlite3, tokenizer, gd, exif, zip, fileinfo
          coverage: none

      - name: Select Laravel ${{ matrix.laravel }}
        run: |
          composer require --no-update --no-interaction "illuminate/contracts:^${{ matrix.laravel }}.0" "illuminate/filesystem:^${{ matrix.laravel }}.0" "illuminate/support:^${{ matrix.laravel }}.0" "illuminate/view:^${{ matrix.laravel }}.0"
          composer require --dev --no-update --no-interaction "orchestra/testbench:${{ matrix.testbench }}"

      - name: Select Livewire ${{ matrix.livewire }}
        run: |
          if [ "${{ matrix.livewire }}" = "none" ]; then
            composer remove --dev --no-update --no-interaction livewire/livewire
          else
            composer require --dev --no-update --no-interaction "livewire/livewire:^${{ matrix.livewire }}.0"
          fi

      - name: Allow end-of-life Laravel releases with known advisories
        if: matrix.laravel == '10' || matrix.laravel == '11'
        run: |
          php -r '$f = "composer.json"; $j = json_decode(file_get_contents($f), true);
            $j["config"]["policy"]["advisories"]["block"] = false;
            $j["config"]["audit"]["block-insecure"] = false;
            file_put_contents($f, json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES)."\n");'

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Installed versions
        run: composer show laravel/framework livewire/livewire phpunit/phpunit 2>/dev/null | grep -E '^(name|versions)' || true

      - name: Run tests
        run: vendor/bin/phpunit

  coverage:
    name: Code coverage (min 95%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, pdo_sqlite, sqlite3, tokenizer, gd, exif, zip, fileinfo
          coverage: pcov

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests with coverage
        run: vendor/bin/phpunit --coverage-clover build/clover.xml

      - name: Enforce minimum line coverage
        run: |
          php -r '$m = simplexml_load_file("build/clover.xml")->project->metrics;
            $pct = (int) $m["statements"] > 0 ? (int) $m["coveredstatements"] / (int) $m["statements"] * 100 : 0;
            printf("Line coverage: %.2f%%\n", $pct);
            exit($pct >= 95 ? 0 : 1);'
